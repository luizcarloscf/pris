server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Zensical fingerprints its assets, so they can be cached for long.
    location /assets/ {
        expires 30d;
    }

    error_page 404 /404.html;
}
