[project]
site_name = "PRIS"
site_description = "Documentation of the PRIS (Intelligent Space) stack"
docs_dir = "content"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Libraries" = [
    { "pris-msgs" = "libraries/pris-msgs.md" },
    { "pris-wire" = "libraries/pris-wire.md" },
    { "OpenTelemetry instrumentation" = "libraries/opentelemetry-instrumentation-pris-wire.md" },
    { "pris-common" = "libraries/pris-common.md" },
  ] },
  { "Services" = [
    { "pris-aruco-detector" = "services/pris-aruco-detector.md" },
    { "pris-aruco-localization" = "services/pris-aruco-localization.md" },
    { "pris-broker-events" = "services/pris-broker-events.md" },
    { "pris-calibration-server" = "services/pris-calibration-server.md" },
    { "pris-frame-transformation" = "services/pris-frame-transformation.md" },
  ] },
  { "Deployment" = [
    { "Libraries from git tags" = "deployment/git-dependencies.md" },
    { "Docker images" = "deployment/docker.md" },
    { "Kubernetes" = "deployment/kubernetes.md" },
  ] },
  { "Project" = [
    { "Status" = "project/status.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
