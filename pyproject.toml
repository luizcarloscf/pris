[tool.uv.workspace]
members = ["packages/pris-msgs", "packages/pris-wire"]

[tool.uv.sources]
pris-msgs = { workspace = true }
pris-wire = { workspace = true }

[dependency-groups]
dev = [
    "pris-msgs[numpy,opencv,turbojpeg]",
    "pytest==8.3.5",
    "flake8==7.2.0",
    "mypy==2.4.1",
    "zensical==0.1.0; python_version >= '3.11'",
    "grpcio-tools==1.85.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ['_pb2\.pyi?$']
