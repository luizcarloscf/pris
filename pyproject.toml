[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "flake8==7.2.0",
    "mypy==1.15.0",
    "zensical==0.1.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ['_pb2\.pyi?$']
