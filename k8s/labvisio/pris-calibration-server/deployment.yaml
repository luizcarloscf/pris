apiVersion: apps/v1
kind: Deployment
metadata:
  name: pris-calibration-server
  namespace: pris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pris-calibration-server
  template:
    metadata:
      labels:
        app: pris-calibration-server
    spec:
      containers:
        - name: pris-calibration-server
          image: luizcarloscf/pris-calibration-server:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: INFO
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: options
              mountPath: /etc/pris-calibration-server
            - name: calibrations
              mountPath: /etc/calibrations
              readOnly: true
      volumes:
        - name: options
          configMap:
            name: pris-calibration-server
        - name: calibrations
          configMap:
            name: pris-calibration-server-calibrations
