apiVersion: apps/v1
kind: Deployment
metadata:
  name: pris-camera-gateway-2
  namespace: pris
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pris-camera-gateway-2
  template:
    metadata:
      labels:
        app: pris-camera-gateway-2
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pris-camera-gateway
          image: luizcarloscf/pris-camera-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: INFO
          resources:
            limits:
              cpu: 1500m
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: options
              mountPath: /etc/pris-camera-gateway
      volumes:
        - name: options
          configMap:
            name: pris-camera-gateway-2
