apiVersion: apps/v1
kind: Deployment
metadata:
  name: pris-aruco-detector
  namespace: pris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pris-aruco-detector
  template:
    metadata:
      labels:
        app: pris-aruco-detector
    spec:
      containers:
        - name: pris-aruco-detector
          image: luizcarloscf/pris-aruco-detector:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: INFO
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: options
              mountPath: /etc/pris-aruco-detector
      volumes:
        - name: options
          configMap:
            name: pris-aruco-detector
