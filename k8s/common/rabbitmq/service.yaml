apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pris
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
      nodePort: 31000
    - name: management
      protocol: TCP
      port: 80
      targetPort: 15672
      nodePort: 31080
    - name: mqtt
      protocol: TCP
      port: 1883
      targetPort: 1883
      nodePort: 31001
    - name: web-mqtt
      protocol: TCP
      port: 15675
      targetPort: 15675
      nodePort: 31002
