apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pris
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: ui
      protocol: TCP
      port: 16686
      targetPort: 16686
      nodePort: 31686
