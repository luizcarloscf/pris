apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pris
  labels:
    app: jaeger
spec:
  selector:
    matchLabels:
      app: jaeger
  replicas: 1
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.22.0
        ports:
        - containerPort: 4317
        - containerPort: 16686
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 2Gi
            cpu: "1"
