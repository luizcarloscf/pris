[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pris-wire"
version = "1.0.0"
description = "Publish/subscribe and request/reply for PRIS over AMQP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "labvisio", email = "labvisio.ufes@gmail.com" }]
maintainers = [{ name = "Luiz Carlos Cosmi Filho", email = "luizcarloscosmifilho@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "amqp>=5.4.1,<6",
    "colorlog>=6.12.0,<7",
    "protobuf>=7.35.1,<8",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pris_wire"]
